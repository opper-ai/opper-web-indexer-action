name: "Opper Web Indexer Action"
description: "Scrapes web content and adds it to an Opper index"
inputs:
  apikey:
    description: "Opper API key"
    required: true
  index:
    description: "Name of the Opper index to update"
    required: true
  url:
    description: "URL to scrape"
    required: true
  element:
    description: "HTML element to extract (if not specified, uses the full page)"
    required: false
runs:
  using: "docker"
  image: "Dockerfile"
  args:
    - ${{ inputs.apikey }}
    - ${{ inputs.index }}
    - ${{ inputs.url }}
    - ${{ inputs.element && format('--element={0}', inputs.element) || '' }}
